<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coolay</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;650&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <a class="logo" href="index.html">
          <img class="mark" src="assets/favicon.svg" alt="" />
          Coolay
        </a>
        <div class="app-meta">
          <span class="badge" data-plan-badge></span>
          <span data-user></span>
          <button class="btn btn-ghost" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <!-- Put the Coolay application inside [data-app-slot]. -->
      <main class="app-slot" data-app-slot></main>
    </div>
    <script src="assets/js/access.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
